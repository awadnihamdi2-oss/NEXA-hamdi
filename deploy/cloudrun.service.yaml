# Declarative Google Cloud Run (Knative) Service Template for NEXA QUANT INTELLIGENCE
# IMPORTANT SQLITE PERSISTENCE REQUIREMENT:
# 1. Container-local disk is ephemeral across Cloud Run revisions and cold starts.
# 2. Cloud Storage FUSE does NOT safely support SQLite WAL POSIX byte-range locks.
# 3. For production SQLite persistence on Cloud Run, attach a Cloud Filestore (NFS with POSIX locking)
#    volume at /app/data AND lock autoscaling maxScale to "1" (single writer), OR deploy on a single GCE VM
#    with attached Persistent Disk, OR migrate the database layer to Cloud SQL PostgreSQL.

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: nexa-quant-intelligence
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        # Strict single-writer constraint required for SQLite WAL consistency
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "1"
        run.googleapis.com/execution-environment: gen2
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      serviceAccountName: nexa-runtime-sa@PROJECT_ID.iam.gserviceaccount.com
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/nexa/nexa-app:latest
          ports:
            - name: http1
              containerPort: 3000
          resources:
            limits:
              cpu: "1"
              memory: "1Gi"
          env:
            - name: NODE_ENV
              value: "production"
            - name: APP_URL
              value: "https://REPLACE_WITH_CLOUD_RUN_HTTPS_URL"
            - name: DISABLE_HMR
              value: "true"
            - name: NEXA_DB_PATH
              value: "/app/data/nexa_genesis.sqlite3"
            - name: NEXA_PAID_FALLBACK_ALLOWED
              value: "false"
            - name: NEXA_LIVE_TRADING_ENABLED
              value: "false"
            - name: NEXA_EXTERNAL_COMMERCE_ENABLED
              value: "false"
            # Required production secrets sourced exclusively from Google Secret Manager
            - name: NEXA_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: nexa-session-secret
                  key: latest
            - name: NEXA_SCHEDULER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: nexa-scheduler-token
                  key: latest
            - name: NEXA_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nexa-admin-password
                  key: latest
            # Optional AI provider keys (uncomment/provision only for enabled providers)
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: nexa-gemini-api-key
                  key: latest
          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 30
            timeoutSeconds: 4
            failureThreshold: 3
          volumeMounts:
            - name: nexa-persistent-data
              mountPath: /app/data
      volumes:
        # Must use POSIX-compliant persistent filesystem (e.g., Cloud Filestore NFS), NOT Cloud Storage FUSE.
        - name: nexa-persistent-data
          nfs:
            server: REPLACE_WITH_FILESTORE_IP
            path: /nexa_data
